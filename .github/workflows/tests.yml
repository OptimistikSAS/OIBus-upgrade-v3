name: Run OIBus tests

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md" ]
  pull_request:
    types: [ opened, synchronize, ready_for_review ]
    paths-ignore: [ "**.md" ]

concurrency:
  # New commit on branch cancels running workflows of the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test on ${{ matrix.config['os'] }}
    runs-on: ${{ matrix.config['os'] }}
    strategy:
      matrix:
        config:
          - { os: 'macos-latest' }
          - { os: 'windows-latest' }
          - { os: 'ubuntu-latest' }
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Run linting
        shell: bash
        run: npm run lint

      - name: Check build
        shell: bash
        run: npm run build

      - name: Run unit tests
        shell: bash
        run: npm test
